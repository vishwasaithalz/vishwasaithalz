<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="t d">
<title id="t">Build log terminal illustration</title><desc id="d">A neon terminal showing a fictional local development workflow.</desc>
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#080d19"/><stop offset="1" stop-color="#17142b"/></linearGradient><linearGradient id="l"><stop stop-color="#52e6ff"/><stop offset="1" stop-color="#b18cff"/></linearGradient></defs>
<rect x="2" y="2" width="996" height="206" rx="16" fill="url(#b)" stroke="#4de8ff" stroke-opacity=".45"/>
<path d="M3 43H997" stroke="#7d8eae" stroke-opacity=".25"/>
<circle cx="27" cy="23" r="5" fill="#ff668e"/><circle cx="46" cy="23" r="5" fill="#ffc766"/><circle cx="65" cy="23" r="5" fill="#63e6a6"/>
<text x="92" y="27" fill="#91a2c3" font-family="monospace" font-size="12">vishwas@lab: ~/build-log</text>
<g font-family="monospace" font-size="15">
 <text x="28" y="78" fill="#58e6ff">$</text><text x="48" y="78" fill="#e8edfa"> git status --short</text><text x="310" y="78" fill="#65e6a2">✓ working tree monitored</text>
 <text x="28" y="112" fill="#58e6ff">$</text><text x="48" y="112" fill="#e8edfa"> python -m unittest</text><text x="260" y="112" fill="#65e6a2">✓ tests passing in CI</text>
 <text x="28" y="146" fill="#58e6ff">$</text><text x="48" y="146" fill="#e8edfa"> npm run demo</text><text x="190" y="146" fill="#65e6a2">✓ local-first workflow ready</text>
 <text x="28" y="180" fill="#a88dff">></text><text x="48" y="180" fill="#c2cce1">small steps. real builds. honest progress.</text>
</g>
<rect x="626" y="165" width="9" height="18" rx="1" fill="url(#l)"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>