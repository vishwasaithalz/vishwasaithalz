<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" aria-labelledby="t d"><title id="t">KARMA origin story</title><desc id="d">Four animated chat messages recount the journey from a 2013 tech blog to cybersecurity and automation projects</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#170B3D"/><stop offset="1" stop-color="#112B42"/></linearGradient><style>.msg{animation:appear 8s infinite;transform-origin:center;opacity:0}@keyframes appear{0%,5%{opacity:0;transform:translateY(10px)}12%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}.a{animation-delay:0s}.b{animation-delay:.8s}.c{animation-delay:1.6s}.e{animation-delay:2.4s}@media(prefers-reduced-motion:reduce){.msg{animation:none;opacity:1}}</style></defs><rect width="780" height="360" rx="24" fill="url(#bg)"/><text x="30" y="39" fill="#A9FF78" font-family="monospace" font-size="18">💬 KARMA / TIME MACHINE</text><g class="msg a"><rect x="28" y="61" width="505" height="52" rx="18" fill="#3C326A"/><text x="47" y="93" fill="#FFF" font-size="18" font-family="Arial">2013: What are you building?</text></g><g class="msg b"><rect x="200" y="126" width="552" height="52" rx="18" fill="#086C7B"/><text x="220" y="158" fill="#FFF" font-size="18" font-family="Arial">A little corner of the internet. 🌗</text></g><g class="msg c"><rect x="28" y="191" width="505" height="52" rx="18" fill="#3C326A"/><text x="47" y="223" fill="#FFF" font-size="18" font-family="Arial">And now?</text></g><g class="msg e"><rect x="122" y="256" width="630" height="52" rx="18" fill="#8D357D"/><text x="142" y="288" fill="#FFF" font-size="18" font-family="Arial">Security labs, automation and open builds. ⚡</text></g><text x="31" y="340" fill="#D8A3FF" font-size="12" font-family="monospace">ORIGINAL ANIMATED SVG · NO THIRD-PARTY TRACKING</text></svg>