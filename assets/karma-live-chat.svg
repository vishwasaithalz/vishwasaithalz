<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-labelledby="t d"><title id="t">VISHWAS AITHAL live-style story chat</title><desc id="d">Animated simulated conversation about the 2013 blog and current security builds. Click to open the actual interactive scripted chat.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1E1944"/><stop offset="1" stop-color="#102F42"/></linearGradient><style>.bubble{opacity:0;animation:show 12s infinite}.b1{animation-delay:0s}.b2{animation-delay:1.4s}.b3{animation-delay:2.8s}.b4{animation-delay:4.2s}.b5{animation-delay:5.6s}.b6{animation-delay:7s}.dot{animation:pulse 1.2s infinite}@keyframes show{0%,7%{opacity:0;transform:translateY(6px)}13%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.bubble{animation:none;opacity:1}.dot{animation:none}}</style></defs><rect x="1" y="1" width="898" height="383" rx="22" fill="url(#bg)" stroke="#FF73A8" stroke-width="2"/><rect x="1" y="1" width="898" height="65" rx="22" fill="#2F245B"/><rect x="1" y="55" width="898" height="15" fill="#2F245B"/><circle cx="40" cy="35" r="21" fill="#FF73A8"/><text x="31" y="43" font-size="24" font-family="Arial" font-weight="900" fill="#21102A">V</text><text x="72" y="32" font-size="17" fill="#FFF" font-family="Arial" font-weight="800">VISHWAS AITHAL / MEMORY ARCHIVE</text><text x="73" y="50" font-size="11" fill="#A9FF78" font-family="monospace">● SCRIPTED STORY / INTERACTIVE VERSION AVAILABLE</text><rect class="bubble b1" x="24" y="88" width="435" height="44" rx="16" fill="#403267"/><text class="bubble b1" x="43" y="116" fill="#FFF" font-family="Arial" font-size="17">2013. One screen. What are we building?</text><rect class="bubble b2" x="285" y="143" width="586" height="44" rx="16" fill="#0D788B"/><text class="bubble b2" x="304" y="171" fill="#FFF" font-family="Arial" font-size="17">🌗 YinYangYoHackers. A tiny corner of the internet.</text><rect class="bubble b3" x="24" y="198" width="338" height="44" rx="16" fill="#403267"/><text class="bubble b3" x="43" y="226" fill="#FFF" font-family="Arial" font-size="17">Fast-forward. What changed?</text><rect class="bubble b4" x="240" y="253" width="631" height="44" rx="16" fill="#8B356E"/><text class="bubble b4" x="258" y="281" fill="#FFF" font-family="Arial" font-size="17">🛡️ Security labs. 🤖 Automation. 🎮 Working demos.</text><rect x="24" y="318" width="850" height="46" rx="14" fill="#13182E" stroke="#6E628D"/><text x="43" y="348" fill="#C9BCE7" font-size="16" font-family="Arial">Open the interactive chat and ask your own question...</text><circle class="dot" cx="847" cy="341" r="7" fill="#A9FF78"/></svg>