<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 112" role="img" aria-labelledby="t d"><title id="t">PLAY KARMA PINBALL</title><desc id="d">Click to launch the real browser pinball game in KARMA Arcade 3.0</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#552543"/><stop offset="1" stop-color="#0d263b"/></linearGradient><style>.ball{animation:roll 2.8s ease-in-out infinite alternate}.lights{animation:pulse 1.6s ease-in-out infinite}@keyframes roll{from{transform:translate(0,0)}to{transform:translate(23px,-21px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.ball,.lights{animation:none}}</style></defs><rect x="2" y="2" width="356" height="108" rx="18" fill="url(#bg)" stroke="#FFC55A" stroke-width="3"/><path d="M19 24L29 12L39 24M19 88L29 100L39 88" stroke="#FF73A8" stroke-width="3" fill="none"/><g class="lights"><circle cx="42" cy="36" r="12" fill="#65DEFF"/><circle cx="60" cy="70" r="17" fill="#FF73A8"/><circle cx="84" cy="37" r="10" fill="#A9FF78"/></g><g class="ball"><circle cx="47" cy="55" r="10" fill="#fff" stroke="#FFC55A" stroke-width="3"/></g><text x="113" y="47" font-size="20" font-family="Arial,sans-serif" font-weight="900" fill="#fff">PLAY PINBALL</text><text x="113" y="77" font-size="13" font-family="monospace" fill="#FFC55A">KARMA 198X / ARCADE 3.0</text><path d="M315 45l13 10-13 10" stroke="#65DEFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>