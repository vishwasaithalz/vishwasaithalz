<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">KARMA Command Deck</title><desc id="desc">Midnight command center with technical grid, warm amber and teal lines and the KARMA wordmark</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#192332"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#3f9e9d" stroke-opacity=".15"/></pattern></defs><rect width="1200" height="320" rx="18" fill="url(#bg)"/><rect width="1200" height="320" fill="url(#grid)"/><path d="M50 50H1150M50 270H1150" stroke="#c69a5a" stroke-opacity=".6"/><circle cx="1050" cy="160" r="95" fill="none" stroke="#3f9e9d" stroke-opacity=".6"/><circle cx="1050" cy="160" r="63" fill="none" stroke="#c69a5a" stroke-opacity=".6"/><path d="M955 160H1145M1050 65V255" stroke="#3f9e9d" stroke-opacity=".35"/><text x="64" y="92" fill="#c69a5a" font-family="monospace" font-size="19" letter-spacing="5">SYSTEM / ENGINEERING FIELD NOTES</text><text x="58" y="205" fill="#e7e8e4" font-family="Arial,sans-serif" font-size="114" font-weight="800" letter-spacing="9">KARMA</text><text x="64" y="249" fill="#3f9e9d" font-family="monospace" font-size="22" letter-spacing="3">BUILD  /  SECURE  /  AUTOMATE</text></svg>