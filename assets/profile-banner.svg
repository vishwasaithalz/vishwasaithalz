<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Vishwas Aithal cyber technology banner</title><desc id="desc">A dark cyber-themed banner with neon cyan and violet orbital lines, terminal details and the words Build. Secure. Automate.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset=".55" stop-color="#10152b"/><stop offset="1" stop-color="#1b1030"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4de8ff"/><stop offset=".52" stop-color="#9b8cff"/><stop offset="1" stop-color="#ff5ca8"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#36dfff" stop-opacity=".28"/><stop offset="1" stop-color="#36dfff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8aa4d8" stroke-opacity=".09" stroke-width="1"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/><rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<ellipse cx="940" cy="160" rx="270" ry="210" fill="url(#glow)" filter="url(#blur)"/>
<g fill="none" stroke="url(#neon)" opacity=".7"><path d="M720 300C850 40 1010 30 1160 150" stroke-width="2"/><path d="M760 330C900 80 1040 80 1190 190" stroke-width="1.5" opacity=".55"/><ellipse cx="965" cy="170" rx="175" ry="75" transform="rotate(-28 965 170)" stroke-width="1.5"/><ellipse cx="965" cy="170" rx="175" ry="75" transform="rotate(42 965 170)" stroke-width="1" opacity=".55"/></g>
<g fill="#55e7ff"><circle cx="827" cy="100" r="3"/><circle cx="1090" cy="255" r="3"/><circle cx="1000" cy="75" r="2"/></g>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
 <text x="78" y="82" fill="#65e7ff" font-size="15" letter-spacing="5">PORTFOLIO / 2026</text>
 <text x="74" y="165" fill="#f4f7ff" font-size="66" font-weight="700" letter-spacing="-2">VISHWAS</text>
 <text x="74" y="225" fill="url(#neon)" font-size="52" font-weight="700" letter-spacing="7">AITHAL</text>
 <text x="80" y="275" fill="#b7c4df" font-size="17" letter-spacing="3">BUILD  ·  SECURE  ·  AUTOMATE</text>
 <text x="80" y="322" fill="#6f829f" font-size="12" letter-spacing="2">CYBERSECURITY  /  AI SYSTEMS  /  SOFTWARE</text>
</g>
<rect x="75" y="105" width="88" height="3" rx="2" fill="url(#neon)"/>
