 <circle cx="18" cy="17" r="4" fill="#ff668e"/><circle cx="32" cy="17" r="4" fill="#ffc766"/><circle cx="46" cy="17" r="4" fill="#63e6a6"/>
 <text x="18" y="49" fill="#6b829f" font-size="10">SYSTEM STATUS</text>
 <text x="18" y="73" fill="#65e7ff" font-size="14">● ONLINE</text>
 <text x="18" y="96" fill="#c3cce0" font-size="11">learning // building // shipping</text>
