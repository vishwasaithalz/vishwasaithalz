<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="mainTitle mainDesc">
<title id="mainTitle">Vishwas Aithal | The Cybercafe Kid</title><desc id="mainDesc">An original tactile beige CRT with green DOS phosphor, a worn old PC desk, and the story of Vishwas Aithal from Windows 95 to modern security and web engineering.</desc>
<defs>
<linearGradient id="wall" x2="0" y2="1"><stop stop-color="#1b262d"/><stop offset=".63" stop-color="#202f35"/><stop offset="1" stop-color="#111c22"/></linearGradient>
<linearGradient id="bezel" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#fff0d1"/><stop offset=".27" stop-color="#d8d0ba"/><stop offset=".66" stop-color="#b0ab96"/><stop offset="1" stop-color="#8f8c79"/></linearGradient>
<linearGradient id="plastic" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ece5d4"/><stop offset=".5" stop-color="#b6b09d"/><stop offset="1" stop-color="#7e8074"/></linearGradient>
<radialGradient id="crt" cx=".48" cy=".48" r=".7"><stop stop-color="#18362a"/><stop offset=".75" stop-color="#0a2419"/><stop offset="1" stop-color="#030e0c"/></radialGradient>
<linearGradient id="glass" x1=".05" y1="0" x2=".85" y2="1"><stop stop-color="#f3ffe8" stop-opacity=".19"/><stop offset=".42" stop-color="#f3ffe8" stop-opacity=".025"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
<linearGradient id="metal" x2="0" y2="1"><stop stop-color="#5b5960"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#4b3429"/><stop offset=".6" stop-color="#241a19"/><stop offset="1" stop-color="#1b171b"/></linearGradient>
<pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 4.3H1200" stroke="#030d0a" stroke-width=".8" opacity=".17"/></pattern>
<filter id="shadow" x="-25%" y="-25%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="rough" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="2" seed="9" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
</defs>
<style>
@keyframes power{0%,100%{opacity:.67}47%{opacity:1}49%{opacity:.94}70%{opacity:.82}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{from{transform:translateY(-165px)}to{transform:translateY(165px)}}
@keyframes load{0%{stroke-dashoffset:340}15%{stroke-dashoffset:340}85%,100%{stroke-dashoffset:0}}
.phosphor{animation:power 6.2s linear infinite}.cursor{animation:blink 1.07s steps(1) infinite}.lightband{animation:sweep 8s linear infinite}.load{stroke-dasharray:340;stroke-dashoffset:340;animation:load 9s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.phosphor,.cursor,.lightband,.load{animation:none}.load{stroke-dashoffset:0}}
</style>
