<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="era-title era-desc">
<title id="era-title">Vishwas Aithal | Four eras of one computer kid</title>
<desc id="era-desc">A left-to-right timeline moving from a green phosphor CRT and DOS screen in the 1990s, to Windows XP and Winamp in the 2000s, to the YinYangYoHackers blog in 2013, to GitHub engineering today.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131b"/><stop offset=".52" stop-color="#122738"/><stop offset="1" stop-color="#101e31"/></linearGradient>
  <linearGradient id="xp" x1="0" y1="0" x2="1"><stop stop-color="#19469b"/><stop offset="1" stop-color="#42a9b5"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H1200" stroke="#01060d" stroke-opacity=".16" stroke-width="1"/></pattern>
</defs>
<style>
@keyframes pulse-era{0%,100%{opacity:.48}50%{opacity:1}}
@keyframes progress-era{0%{transform:translateX(0)}33%{transform:translateX(287px)}66%{transform:translateX(574px)}100%{transform:translateX(861px)}}
.era-led{animation:pulse-era 2.4s ease-in-out infinite}
.era-dot{animation:progress-era 12s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.era-led,.era-dot{animation:none}}
</style>
