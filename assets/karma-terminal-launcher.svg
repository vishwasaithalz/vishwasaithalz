<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="t d"><title id="t">VISHWAS AITHAL interactive terminal launcher</title><desc id="d">Retro terminal with typed project commands. Click to open the functional read-only browser terminal.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0C1428"/><stop offset="1" stop-color="#112D3B"/></linearGradient><style>.cursor{animation:blink 1s steps(2,end) infinite}.glow{animation:pulse 3s infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.cursor,.glow{animation:none}}</style></defs><rect x="1" y="1" width="898" height="308" rx="18" fill="url(#bg)" stroke="#65DEFF" stroke-width="3"/><rect x="2" y="2" width="896" height="49" rx="17" fill="#2A3150"/><circle cx="32" cy="26" r="9" fill="#FF7398"/><circle cx="57" cy="26" r="9" fill="#FFC55A"/><circle cx="82" cy="26" r="9" fill="#A9FF78"/><text x="310" y="33" font-family="monospace" font-size="17" fill="#E6E9FF">vishwas@github : ~/interactive-lab</text><text x="26" y="89" fill="#65DEFF" font-family="monospace" font-size="20">VISHWAS AITHAL.EXE  /  PUBLIC DEMO TERMINAL</text><text x="26" y="132" fill="#A9FF78" font-family="monospace" font-size="18">vishwas@github:~$ projects</text><text x="26" y="165" fill="#FFF" font-family="monospace" font-size="18">🛡️ LogSentry    🔎 Recon Lite    🤖 AI Automation Lab</text><text x="26" y="195" fill="#D8A3FF" font-family="monospace" font-size="18">🎮 CyberPlayground    🌗 YYYH    🛰️ VISHWAS AITHAL Ops</text><text x="26" y="233" fill="#A9FF78" font-family="monospace" font-size="18">vishwas@github:~$ help</text><text x="26" y="263" fill="#FFCA69" font-family="monospace" font-size="15">CLICK TO OPEN THE REAL TERMINAL EXPLORER</text><rect class="cursor" x="625" y="247" width="12" height="20" fill="#65DEFF"/></svg>