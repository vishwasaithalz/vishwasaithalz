<script>
(function(){
'use strict';
var openWindows={},topZ=10,activeApp='',snakeTimer=null,snake=null;
var appTitles={overload:'Overload 2.0',museum:'Museum.exe',about:'My Computer',software:'Program Files',music:'Winamp-ish',games:'Game Folder',snake:'Snake.exe',cartoons:'Saturday TV',blog:'Blogger 2013',projects:'My Projects',terminal:'Command Prompt',timeline:'Restore Points'};
var appOrder=['overload','museum','about','software','music','games','snake','cartoons','blog','projects','terminal','timeline'];
var appContent={
overload:'<h2>💥 OVERLOAD 2.0</h2><p>The extra-expansion disk is here. It brings playable original Minesweeper and Pong, a canvas painting app, mock PC parts builder, retro BIOS, a screensaver, local terminal, simulated defrag and optional public GitHub activity.</p><p><strong>New programs loaded:</strong> MINES.EXE | PONG.EXE | PAINT.EXE | HARDWARE.EXE | COMMAND.COM | DEFRAG.EXE | BIOS.EXE</p><a class="btn" href="../overload/">▶ BOOT OVERLOAD 2.0</a><p class="note">No third-party game downloads, simulated tools only, original audio optional.</p>',
museum:'<h2>💾 MUSEUM.EXE</h2><p>The expansion pack is installed. Open a searchable museum with 102 memory files, seven archive folders, two original mini-games, four desktop themes and an Easter egg.</p><p>Winamp, Windows 95 to 11, Counter-Strike, cartoons, Blogger 2013 and the current engineering workbench live here.</p><a class="btn" href="../museum/">▶ OPEN INTERNET MUSEUM</a><p class="note">Nostalgia references only. No original games, music, software downloads or trackers.</p>',
about:'<h2>🖥️ C:\\VISHWAS\\ABOUT.TXT</h2><p><strong>Vishwas Aithal</strong> here. A 90s and 2000s computer kid who grew into a tech blogger, developer, automation builder and defensive security enthusiast.</p><p>Winamp playlists, ISO mounts, game shortcuts, Windows experiments and cartoon marathons were my early curriculum. The machine changed from <strong>Windows 95 to Windows 11</strong>. The curiosity stayed.</p><p><strong>Today:</strong> Python, JavaScript, safe security labs, websites, AI workflow experiments and public build notes.</p><button class="btn" data-open="timeline">Open timeline</button><button class="btn" data-open="projects">See real projects</button>',
software:'<h2>💿 C:\\PROGRAM FILES</h2><p>The old-school utility drawer. These are memories, not endorsements or downloads.</p><div class="folder-grid"><div class="folder"><strong>🎧 Media</strong>Winamp 2.x, VLC, skins, playlists, pixel visualizers</div><div class="folder"><strong>💿 Virtual drives</strong>Daemon Tools, PowerISO, mounting disc images</div><div class="folder"><strong>📦 Archives and downloads</strong>WinRAR, Internet Download Manager, µTorrent</div><div class="folder"><strong>🧹 Maintenance</strong>CCleaner, Registry Mechanic, and forever tweaking Windows</div></div><p class="note">No installers, third-party downloads or executable software are supplied here.</p>',
music:'<h2>🎵 VISUALIZER.EXE</h2><p>A little tribute to the Winamp skins and equalizers that made listening to MP3s an entire desktop activity.</p><div class="player"><div class="track">01. The kid who never logged off<br><small>STATUS: MEMORY MODE</small></div><div class="eq" id="equalizer"></div><button class="btn" id="eq-toggle">▶ Animate visualizer</button><small> Visual tribute only. No music or audio playback.</small></div><p><a href="https://github.com/vishwasaithalz/vishwasaithalz" target="_blank" rel="noopener noreferrer">View my real contribution-based Winamp-style chart on GitHub</a></p><p><a class="btn" href="../overload/tracker.html">🎚 OPEN ORIGINAL TRACKER STUDIO</a></p>',
games:'<h2>🎮 C:\\GAMES</h2><p>Before PC benchmarks, there was the very important question: <strong>Will this game run?</strong></p><p><span class="tag">Snake</span><span class="tag">Mario</span><span class="tag">Contra</span><span class="tag">Tanks / Battle City</span><span class="tag">Virtua Cop 2</span><span class="tag">Project I.G.I.</span><span class="tag">Counter-Strike</span></p><p>Playable here: an <strong>original Snake mini-game</strong>. Other titles are references to the classics, not distributed copies.</p><button class="btn" data-open="snake">▶ PLAY SNAKE.EXE</button><a class="btn" href="https://vishwasaithalz.github.io/vishwasaithalz/arcade/#pinball" target="_blank" rel="noopener noreferrer">OPEN ORIGINAL PINBALL</a>',
cartoons:'<h2>📺 AFTER SCHOOL / ON AIR</h2><p>When the PC was off, the imagination stayed switched on.</p><div class="folder-grid"><div class="folder"><strong>🧪 Cartoon laboratory</strong>Dexter\'s Laboratory, Johnny Bravo, The Powerpuff Girls</div><div class="folder"><strong>💪 Classics</strong>Popeye and the everlasting spinach-powered comeback</div><div class="folder"><strong>⚡ Action hour</strong>Power Rangers S.P.D., Pokémon, Beyblade</div><div class="folder"><strong>💭 The connection</strong>Build things. Experiment. Train. Try again. A pretty great developer origin story.</div></div><p class="note">Names only. No copied footage, logos or theme songs.</p>',
blog:'<h2>🌐 INTERNET EXPLORER / BLOGGER 2013</h2><p>One of the first meaningful windows into my online tech world was <strong>YinYangYoHackers</strong>. Writing, experimenting and learning in public became part of the journey.</p><p><a class="btn" href="https://yinyangyohackers.blogspot.com" target="_blank" rel="noopener noreferrer">Legacy Blogger</a><a class="btn" href="https://yyyh-phi.vercel.app" target="_blank" rel="noopener noreferrer">Modern site</a><a class="btn" href="https://github.com/vishwasaithalz/YYYH" target="_blank" rel="noopener noreferrer">Source code</a></p><p>No nostalgia without forward motion: the goal is still to create useful work, not just collect old screenshots.</p>',
projects:'<h2>📁 C:\\WORKBENCH\\PROJECTS</h2><p>These shortcuts point to real public repositories or demos.</p><div class="folder-grid"><div class="folder"><strong>🔍 LogSentry</strong>Windows security event learning and analysis.<br><a href="https://github.com/vishwasaithalz/LogSentry" target="_blank" rel="noopener noreferrer">Source</a></div><div class="folder"><strong>📡 Recon Lite</strong>Browser-side public response and header signals.<br><a href="https://recon-lite.vercel.app" target="_blank" rel="noopener noreferrer">Demo</a></div><div class="folder"><strong>🤖 AI Automation Lab</strong>Reproducible workflows and experiments.<br><a href="https://github.com/vishwasaithalz/AI-Automation-Lab" target="_blank" rel="noopener noreferrer">Source</a></div><div class="folder"><strong>🛡️ CyberPlayground</strong>Educational security tools and labs.<br><a href="https://cyber-playground-nu.vercel.app" target="_blank" rel="noopener noreferrer">Demo</a></div><div class="folder"><strong>🌐 YinYangYoHackers</strong>Tech blog and learning archive.<br><a href="https://github.com/vishwasaithalz/YYYH" target="_blank" rel="noopener noreferrer">Source</a></div><div class="folder"><strong>🧪 Ops Monitor</strong>Engineering workshop and portfolio experiments.<br><a href="https://karma-ops-monitor.vercel.app" target="_blank" rel="noopener noreferrer">Demo</a></div></div>',
terminal:'<h2>⌨️ COMMAND.COM</h2><p>Safe local toy terminal. Type <code>help</code> for available commands.</p><div class="terminal"><pre id="terminal-output">VISHWAS MEMORY OS [Version 98.NOW]\n(c) Vishwas Aithal. Original local simulation.\n\n</pre><form id="terminal-form"><label for="terminal-command">C:\\&gt;</label><input id="terminal-command" spellcheck="false" autocomplete="off" aria-label="Terminal command"></form></div>',
timeline:'<h2>⏳ RESTORE POINTS</h2><div class="timeline"><p><strong>Windows 95 through Windows 11</strong><br>Years of desktops, installs, games and endless questions.</p><p><strong>The after-school era</strong><br>Cartoons, cybercafé energy, PC games, software experiments.</p><p><strong>2013: Blogger</strong><br>YinYangYoHackers and the practice of learning publicly.</p><p><strong>Today: The workbench</strong><br>Defensive security, Python, JavaScript, automation and shipping useful demos.</p></div><p><strong>Last known status:</strong> curiosity.exe is still running.</p>',
snake:'<h2>🐍 SNAKE.EXE</h2><p>An original tiny browser game. Use arrow keys, WASD or the on-screen controls.</p><div class="gamebox"><canvas id="snake-canvas" width="480" height="320" aria-label="Snake game field"></canvas></div><div class="gameinfo"><strong id="snake-score">SCORE: 0</strong><span id="snake-state">READY</span><button class="btn" id="snake-start">▶ Start / Restart</button></div><div class="dpad" aria-label="Snake direction controls"><button data-dir="up" aria-label="Up">▲</button><button data-dir="left" aria-label="Left">◀</button><button data-dir="down" aria-label="Down">▼</button><button data-dir="right" aria-label="Right">▶</button></div>'
};
function get(id){return document.getElementById(id)}
function focusApp(id){var w=openWindows[id];if(!w)return;w.style.zIndex=++topZ;document.querySelectorAll('.window').forEach(function(x){x.classList.remove('active')});w.classList.add('active');activeApp=id;w.hidden=false}
function closeApp(id){if(id==='snake'&&snakeTimer){clearInterval(snakeTimer);snakeTimer=null}var w=openWindows[id];if(!w)return;w.remove();delete openWindows[id];var t=document.querySelector('[data-task="'+id+'"]');if(t)t.remove();activeApp='';var remaining=Object.keys(openWindows);if(remaining.length)focusApp(remaining[remaining.length-1])}
function openApp(id){if(!appContent[id])return;if(openWindows[id]){focusApp(id);return}
 var w=document.createElement('section');w.className='window';w.setAttribute('role','dialog');w.setAttribute('aria-label',appTitles[id]);w.dataset.window=id;
 w.innerHTML='<header class="titlebar"><span>▣ '+appTitles[id]+'</span><button class="close" title="Close window" aria-label="Close '+appTitles[id]+'">×</button></header><div class="window-body">'+appContent[id]+'</div><div class="window-status">VISHWAS.EXE / LOCAL MEMORY OS / NO TRACKING</div>';
 get('windows').appendChild(w);openWindows[id]=w;w.querySelector('.close').addEventListener('click',function(){closeApp(id)});
 w.addEventListener('pointerdown',function(){focusApp(id)});setupDrag(w);focusApp(id);
 w.querySelectorAll('[data-open]').forEach(function(b){b.addEventListener('click',function(){openApp(b.dataset.open)})});
 var task=document.createElement('button');task.className='task-app';task.dataset.task=id;task.textContent='▣ '+appTitles[id];task.addEventListener('click',function(){focusApp(id)});get('task-apps').appendChild(task);
 if(id==='music')initMusic(w);if(id==='terminal')initTerminal(w);if(id==='snake')initSnake(w);
}
function setupDrag(w){var h=w.querySelector('.titlebar'),moving=false,downX=0,downY=0,startX=0,startY=0;
 h.addEventListener('pointerdown',function(e){if(e.target.tagName==='BUTTON'||innerWidth<720)return;moving=true;downX=e.clientX;downY=e.clientY;var r=w.getBoundingClientRect();startX=r.left;startY=r.top;w.style.transform='none';w.style.left=startX+'px';w.style.top=startY+'px';h.setPointerCapture(e.pointerId)});
 h.addEventListener('pointermove',function(e){if(!moving)return;var nx=Math.max(0,Math.min(innerWidth-w.offsetWidth,startX+e.clientX-downX));var ny=Math.max(0,Math.min(innerHeight-80,startY+e.clientY-downY));w.style.left=nx+'px';w.style.top=ny+'px'});
 h.addEventListener('pointerup',function(){moving=false});h.addEventListener('pointercancel',function(){moving=false})}
function initMusic(w){var eq=w.querySelector('#equalizer');for(var i=0;i<32;i++){var b=document.createElement('i');b.style.height=(10+(i*13)%55)+'%';b.style.animationDelay='-'+((i*11)%19)/10+'s';eq.appendChild(b)}w.querySelector('#eq-toggle').addEventListener('click',function(){var playing=eq.classList.toggle('playing');this.textContent=playing?'❚❚ Pause visualizer':'▶ Animate visualizer'})}
function initTerminal(w){var out=w.querySelector('#terminal-output'),input=w.querySelector('#terminal-command'),form=w.querySelector('#terminal-form');
 form.addEventListener('submit',function(e){e.preventDefault();var raw=input.value.trim(),cmd=raw.toLowerCase(),response='';
 if(!raw)return;out.textContent+='C:\\> '+raw+'\n';input.value='';
 if(cmd==='help')response='Commands: help, about, whoami, dir, games, projects, version, date, clear';
 else if(cmd==='whoami')response='vishwas_aithal';
 else if(cmd==='about')response='90s desktop kid -> blogger (2013) -> tech builder.';

function initSnake(w){var c=w.querySelector('#snake-canvas'),ctx=c.getContext('2d'),score=w.querySelector('#snake-score'),state=w.querySelector('#snake-state');

 function start(){if(snakeTimer)clearInterval(snakeTimer);snake={body:[{x:11,y:8},{x:10,y:8},{x:9,y:8}],dir:{x:1,y:0},next:{x:1,y:0},food:null,points:0};snake.food=randomFood();score.textContent='SCORE: 0';state.textContent='RUNNING';draw();snakeTimer=setInterval(tick,140)}
 function tick(){snake.dir=snake.next;var head={x:snake.body[0].x+snake.dir.x,y:snake.body[0].y+snake.dir.y},eat=head.x===snake.food.x&&head.y===snake.food.y;
