name: VISHWAS Product Lab Quality

on:
  push:
    branches: [main]
    paths:
      - "labs/**"
      - ".github/workflows/product-lab-quality.yml"
  pull_request:
    paths:
      - "labs/**"
      - ".github/workflows/product-lab-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static data model tests
        run: node --test labs/test/core.test.mjs
      - name: Module syntax
        run: |
          node --check labs/core.mjs
          node --check labs/app.mjs
      - name: Inspect static HTML and local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("labs/index.html").read_text()
          for required in ('id="panel-desk"','id="panel-vault"','id="panel-quotes"','id="panel-feed"','id="chat-form"'):
              # The workbench has no chat service. Check the four real sections only.
              if required == 'id="chat-form"': continue
              assert required in html, required
          for local in ('core.mjs','app.mjs','styles.css'):
              assert (Path('labs')/local).exists(), local
          assert '<script type="module" src="./app.mjs">' in html
          assert '<script src="https:' not in html
          assert '—' not in html and '―' not in html
          print("Product Lab static assets OK")
          PY
