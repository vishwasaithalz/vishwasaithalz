name: Refresh profile statistics

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate-profile-stats.mjs'
      - '.github/workflows/refresh-profile-stats.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate public GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-profile-stats.mjs
      - name: Commit updated statistics when changed
        run: |
          if git diff --quiet -- assets/github-profile-stats.svg; then
            echo "Profile statistics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-profile-stats.svg
          git commit -m "chore: refresh public GitHub profile statistics"
          git push
