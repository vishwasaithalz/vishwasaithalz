name: KARMA selected-project health
on:
  push:
    branches: [main]
    paths:
      - portfolio-control-center/check_health.py
      - portfolio-control-center/test_check_health.py
      - .github/workflows/karma-health.yml
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: karma-selected-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test health-check status classification (offline)
        run: python -m unittest discover -s portfolio-control-center -p 'test_check_health.py' -v
      - name: Probe selected GitHub-linked Vercel URLs
        run: python portfolio-control-center/check_health.py
      - name: Commit real status results only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-control-center/health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record selected-project HTTP health snapshot"
            git push
          fi
