name: KARMA repository orbit
on:
  workflow_dispatch:
  schedule:
    - cron: '45 2 * * 1'
permissions:
  contents: write
jobs:
  orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: NiconiKimg/github-profile-orbit@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          template: space
          theme: auto
          output_path: dist/github-cosmos.svg
      - name: Publish generated orbit only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-cosmos.svg
          git diff --cached --quiet || (git commit -m "chore: refresh repository orbit" && git push)
