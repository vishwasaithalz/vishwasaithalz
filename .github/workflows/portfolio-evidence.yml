name: VISHWAS.EXE Portfolio Evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
  push:
    paths:
      - '.portfolio/refresh.mjs'
      - '.github/workflows/portfolio-evidence.yml'
permissions:
  contents: write
concurrency:
  group: portfolio-evidence
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read public source and CI evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .portfolio/refresh.mjs
      - name: Commit only changed evidence
        run: |
          git add .portfolio/evidence.json
          if git diff --cached --quiet; then
            echo "Evidence unchanged."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public portfolio evidence'
          # Retry a normal fast-forward push if another job moved main.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed before evidence could publish: retry $attempt"
            sleep 2
          done
          echo "::error::Unable to publish public evidence without force-push."
          exit 1
