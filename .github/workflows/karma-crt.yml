name: VISHWAS.EXE Winamp CRT
on:
  workflow_dispatch:
  schedule:
    - cron: '55 2 * * 1'
permissions:
  contents: write
jobs:
  crt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: stefashkaa/github-profile-crt@v1
        with:
          github-user: ${{ github.repository_owner }}
          themes: winamp
          output-dir: assets/crt
      - name: Publish generated contribution display only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/crt
          git diff --cached --quiet || (git commit -m "chore: refresh CRT activity display" && git push)
