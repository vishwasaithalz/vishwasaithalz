name: VISHWAS Pages Browser QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'labs/**'
      - 'arcade/**'
      - 'museum/**'
      - 'overload/**'
      - 'assets/brand/immersive.css'
      - 'assets/brand/immersive.js'
      - 'assets/brand/immersive-v2.css'
      - 'assets/brand/immersive-v2.js'
      - 'assets/brand/new-tabs.js'
      - 'assets/brand/overload-workbench-cover.svg'
      - 'assets/brand/museum-archive-cover.svg'
      - '.github/workflows/pages-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'labs/**'
      - 'arcade/**'
      - 'museum/**'
      - 'overload/**'
      - 'assets/brand/immersive.css'
      - 'assets/brand/immersive.js'
      - 'assets/brand/immersive-v2.css'
      - 'assets/brand/immersive-v2.js'
      - 'assets/brand/new-tabs.js'
      - 'assets/brand/overload-workbench-cover.svg'
      - 'assets/brand/museum-archive-cover.svg'
      - '.github/workflows/pages-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.65.0
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Check responsive pages and interactions
        run: npx playwright test labs/e2e --workers=1 --reporter=line
        env:
          CI: 'true'
      - name: Upload seven desktop and mobile screenshot pairs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vishwas-pages-browser-evidence
          path: |
            qa-screenshots/
            test-results/
          retention-days: 7
          if-no-files-found: warn
