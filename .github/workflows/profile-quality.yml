name: VISHWAS.EXE Profile Quality
on:
  push:
    paths:
      - README.md
      - assets/**
      - tools/**
      - .github/workflows/profile-quality.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - tools/**
      - .github/workflows/profile-quality.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify profile source and local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          readme = Path('README.md').read_text(encoding='utf-8')
          assert 'VISHWAS.EXE UNIFIED THEME START' in readme
          assert 'Vishwas Aithal' in readme
          assert Path('assets/brand/vishwas-exe-main.svg').is_file()
          assert 'https://github.com/vishwasaithalz' in readme
          for path in re.findall(r'(?:src|href)="(assets/[^"]+)"', readme):
              if path.startswith("assets/arcade-gifs/"):
                  # GIFs are generated and checked in the dedicated Arcade workflow.
                  assert Path("scripts/generate-karma-arcade-gifs.py").is_file()
                  assert Path(path).name in {
                      "logsentry.gif", "recon-lite.gif", "automation-lab.gif",
                      "cyberplayground.gif", "yyyh.gif", "karma-ops.gif",
                  }
                  continue
              assert Path(path).is_file(), f"Missing local asset: {path}"
          for path in [*Path('assets').glob('*.svg'), *Path('assets/brand').glob('*.svg')]:
              ET.parse(path)
          assert 'visitor-badge' not in readme.lower()
          print('Profile README and SVG checks passed')
          PY
      - name: Compile public metrics utility
        run: python -m py_compile tools/github_public_metrics.py
